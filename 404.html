<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Страница не найдена · Писательский трекер</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5ef2'/%3E%3Cpath d='M9 23l2.2-6.2L21.4 6.6a2 2 0 012.8 0l1.2 1.2a2 2 0 010 2.8L15.2 20.8 9 23z' fill='%23fff'/%3E%3C/svg%3E">
  <!-- Страница 404 для GitHub Pages. Всё оформлено во встроенном стиле,
       чтобы работать на любой глубине пути без внешних зависимостей. -->
  <style>
    :root {
      --bg: #f4f5fb;
      --surface: #ffffff;
      --border: #e3e6f2;
      --text: #191c2e;
      --muted: #666e92;
      --accent: #6d5ef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1020;
        --surface: #171c33;
        --border: #292f52;
        --text: #eef0fb;
        --muted: #a2a9c9;
        --accent: #8b7dff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 38px 34px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(23, 27, 51, 0.12);
    }
    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid; place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #9a5ef2 70%);
      font-size: 28px;
    }
    .code { font-size: 15px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
    h1 { font-size: 25px; margin: 8px 0 10px; letter-spacing: -0.02em; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }
    a.btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    a.btn:hover { filter: brightness(1.07); }
    .small { font-size: 12.8px; margin-top: 18px; margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">✍</div>
    <div class="code">Ошибка 404</div>
    <h1>Страница не найдена</h1>
    <p>Похоже, такой страницы нет или адрес указан с опечаткой.
       Все разделы приложения «Писательский трекер» открываются из главного меню.</p>
    <a class="btn" id="home-link" href="./index.html">Открыть приложение</a>
    <p class="small">Если переход не произошёл автоматически, нажмите кнопку выше.</p>
  </main>

  <script>
    (function () {
      var link = document.getElementById('home-link');
      // Базовый путь: для сайта проекта /<repo>/..., для сайта пользователя — корень
      var segments = location.pathname.split('/').filter(Boolean);
      var base = segments.length > 1 ? '/' + segments[0] + '/' : '/';
      var target = base + 'index.html' + location.hash;
      link.href = target;

      // Автоматический переход — один раз за сессию, чтобы не зациклиться
      try {
        if (!sessionStorage.getItem('wt-404-redirect')) {
          sessionStorage.setItem('wt-404-redirect', '1');
          setTimeout(function () { location.replace(target); }, 2500);
        }
      } catch (e) {
        /* приватный режим: остаёмся на странице с кнопкой */
      }
    })();
  </script>
</body>
</html>
